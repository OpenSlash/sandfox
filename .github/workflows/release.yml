name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v0.1.0
        required: true
      draft:
        description: Create a draft release
        type: boolean
        default: true

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - name: Build macOS app
        run: |
          export PATH="$HOME/go/bin:$PATH"
          wails3 task package
      - name: Create archive and checksum
        run: |
          version="${{ inputs.version }}"
          mkdir -p dist
          ditto -c -k --keepParent bin/sandfox.app "dist/sandfox-macos-arm64-${version}.zip"
          (cd dist && shasum -a 256 * > "sandfox-macos-arm64-${version}-sha256.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: sandfox-macos-arm64
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - name: Install NSIS
        run: choco install nsis --no-progress
      - name: Build Windows installer
        run: |
          $env:Path = "C:\Program Files (x86)\NSIS;$env:USERPROFILE\go\bin;$env:Path"
          wails3 task windows:package
      - name: Create checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item bin/*-installer.exe dist/
          Get-ChildItem dist | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content dist/windows-sha256.txt
          }
      - uses: actions/upload-artifact@v4
        with:
          name: sandfox-windows-amd64
          path: dist/*

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - name: Build Linux packages
        run: |
          export PATH="$HOME/go/bin:$PATH"
          wails3 task linux:package
      - name: Collect artifacts and checksum
        run: |
          version="${{ inputs.version }}"
          mkdir -p dist
          find bin -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) -exec cp {} dist/ \;
          (cd dist && sha256sum * > "sandfox-linux-${version}-sha256.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: sandfox-linux
          path: dist/*

  github-release:
    if: ${{ !cancelled() && needs.macos.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ "${{ inputs.draft }}" = "true" ]; then args+=(--draft); fi
          gh release create "${{ inputs.version }}" dist/* --repo "$GITHUB_REPOSITORY" --title "${{ inputs.version }}" --notes "Release ${{ inputs.version }}." "${args[@]}"
